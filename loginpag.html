<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-box{
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            width:320px;
            text-align:center;
        }

        .login-box h2{
            margin-bottom:20px;
            color:#333;
        }

        .input-box{
            margin-bottom:15px;
            text-align:left;
        }

        .input-box label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        .input-box input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:10px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#008cff;
        }

        .footer{
            margin-top:15px;
            font-size:14px;
        }

        .footer a{
            color:#4facfe;
            text-decoration:none;
        }

        .footer a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form action="#" method="post">
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn">Login</button>

        <div class="footer">
            <p>Don't have an account? <a href="#">Sign Up</a></p>
        </div>
    </form>
</div>

</body>
</html>
